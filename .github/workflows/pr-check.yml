name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# @vscode/ripgrep's postinstall hits api.github.com/repos/microsoft/ripgrep-prebuilt/releases
# to find the rg binary URL. Unauthenticated requests are rate-limited to 60/h per IP, and
# Actions runners share IP pools — concurrent runs across the org reliably trip the limit
# and 403 the install. Passing the auto-provided GITHUB_TOKEN flips it into the
# authenticated 5000/h bucket, which is plenty.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:check
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (${{ matrix.os }})
    # All supported pipe and PTY platforms are mandatory. These jobs intentionally
    # use the checked-in helpers so normal development is covered without Rust.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  native-windows:
    name: Windows Native Source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile

      - name: Check and test Windows helper source
        run: |
          cargo fmt --manifest-path packages/core/native/windows-job-supervisor/Cargo.toml --check
          cargo test --locked --manifest-path packages/core/native/windows-job-supervisor/Cargo.toml
          cargo fmt --manifest-path packages/core/native/windows-peer-broker/Cargo.toml --check
          cargo test --locked --manifest-path packages/core/native/windows-peer-broker/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path packages/core/native/windows-peer-broker/Cargo.toml -- -D warnings

      - name: Exercise freshly built x64 helpers
        run: |
          pnpm build
          pnpm build:native
          & packages/core/dist/native/windows/x64/xc-peer-broker.exe self-test --protocol 2
          pnpm exec vitest run packages/core/tests/windows-job-provider.test.ts packages/core/tests/windows-supervisor-protocol.test.ts packages/core/tests/pty-provider.test.ts packages/core/tests/windows-peer-broker-protocol.test.ts packages/core/tests/windows-peer-transport.test.ts packages/core/tests/windows-native-artifacts.test.ts

  desktop:
    name: Desktop Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Electron and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm --filter @x-code-cli/desktop exec install-electron

      - run: pnpm --filter @x-code-cli/core build
      - run: pnpm --filter @x-code-cli/desktop build
      - run: pnpm --filter @x-code-cli/desktop typecheck
      - run: pnpm exec vitest run --project desktop

      - name: Runtime smoke
        run: xvfb-run -a pnpm --filter @x-code-cli/desktop exec electron dist/main/index.cjs --smoke-test --no-sandbox

      - name: UI smoke
        run: xvfb-run -a pnpm --filter @x-code-cli/desktop exec electron dist/main/index.cjs --ui-smoke --no-sandbox

  package:
    name: Package Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:package

  commitlint:
    name: Commit Message Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
