name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# @vscode/ripgrep's postinstall hits the GitHub API; authenticate to avoid the
# anonymous rate limit shared across Actions runners.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  macos:
    name: macOS arm64 package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @x-code-cli/desktop typecheck

      - name: Build
        run: pnpm --filter @x-code-cli/desktop build

      - name: UI smoke
        run: pnpm --filter @x-code-cli/desktop smoke:ui

      # Unsigned local-style release. Set CSC_LINK + CSC_NAME (and the Apple
      # notarization variables) as repository secrets to ship a signed build.
      - name: Package dmg + zip
        run: node scripts/release-desktop.mjs --arch arm64 --skip-build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Verifies hashes, latest-mac.yml, dmg/zip integrity and launches the
      # packaged app in headless smoke mode. Unsigned builds are reported as
      # NOT EXECUTED for signing; pass --require-signed for a release gate.
      - name: Verify release artifacts
        run: node scripts/verify-desktop-release.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-code-desktop-macos-arm64
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest-mac.yml
            packages/desktop/release/SHA256SUMS
            packages/desktop/release/RELEASE.json
          if-no-files-found: error

  linux-check:
    name: Linux build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @x-code-cli/desktop typecheck

      - name: Build
        run: pnpm --filter @x-code-cli/desktop build

      - name: Package AppImage + deb
        run: pnpm --filter @x-code-cli/desktop exec electron-builder --linux AppImage deb --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-code-desktop-linux-x64
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/latest-linux.yml
            packages/desktop/release/*.blockmap
          if-no-files-found: error

  windows:
    name: Windows x64 package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @x-code-cli/desktop build

      - name: Package NSIS installer
        run: pnpm --filter @x-code-cli/desktop exec electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-code-desktop-windows-x64
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/latest.yml
            packages/desktop/release/*.blockmap
          if-no-files-found: error
